# Exemple de site nginx avec HTTPS (certbot) pour le CRM LCP.
# Placer dans /etc/nginx/sites-available/crm-lcp.conf puis :
#   ln -s /etc/nginx/sites-available/crm-lcp.conf /etc/nginx/sites-enabled/
#   certbot --nginx -d crm-lcp.exemple.fr
server {
    listen 80;
    server_name crm-lcp.exemple.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name crm-lcp.exemple.fr;

    ssl_certificate     /etc/letsencrypt/live/crm-lcp.exemple.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm-lcp.exemple.fr/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        client_max_body_size 12m;  # pièces justificatives jusqu'à 10 Mo
    }
}
